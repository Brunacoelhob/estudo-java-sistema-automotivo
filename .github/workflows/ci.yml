name: CI

on:
  push:
    branches: [main, 'melhoria/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compila e roda os testes
        run: mvn -B verify
      - name: Constrói a imagem Docker
        run: docker build -t sistema-automotivo .
