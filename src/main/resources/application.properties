# Configuração por variáveis de ambiente: NENHUM segredo no repositório (DB_PASSWORD é obrigatória).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_automotivo?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# O esquema é gerenciado pelo Flyway; o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:8081}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

app.cors.origens=${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
